# Spec 12.2 — Staging environment
# Deploys to staging.villageapi.com for QA testing on every merge to `develop`.
# Applies database migrations to the staging database first, then verifies data integrity.
name: Staging Deploy

on:
  push:
    branches: [develop]

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Migrate & deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Apply migrations to staging database
        run: npm run db:deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Verify data integrity (validation queries)
        run: node scripts/db-verify.mjs
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Build (API + Web)
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}

      - name: Build with Vercel
        run: npx vercel build --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (staging)
        run: npx vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}

      - name: Smoke check
        run: |
          sleep 5
          curl -fsS --retry 20 --retry-connrefused --retry-delay 5 \
            https://staging.villageapi.com/v1/health